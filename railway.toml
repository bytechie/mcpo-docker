[service]
name = "mcpo"

[build]
builder = "dockerfile"

[dockerfile]
path = "./Dockerfile"

[ports]
http = 8000

[deploy]
startCommand = "/bin/sh -c 'exec uvx mcpo --port 8000 --api-key ${MCPO_API_KEY} --name n8n_tool_v2 --server-type ${SERVER_TYPE} -- ${N8N_URL}'"

[[envVars]]
key = "MCPO_API_KEY"
value = "your-secret-key"

[[envVars]]
key = "SERVER_TYPE"
value = "streamable-http"

[[envVars]]
key = "N8N_URL"
value = "https://${{n8n-railway-custom.RAILWAY_PUBLIC_DOMAIN}}/mcp/starter"